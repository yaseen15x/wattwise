spring.application.name=wattwise

# Read the root .env file when running from the backend directory.
spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/wattwise}
spring.datasource.username=${DB_USER:wattwise}
spring.datasource.password=${POSTGRES_PASSWORD}

# Flyway creates tables; Hibernate checks their structure.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false